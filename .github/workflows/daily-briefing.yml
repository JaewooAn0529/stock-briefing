name: daily-stock-briefing

on:
  schedule:
    # GitHub Actions는 UTC 기준 → 한국 아침 7시 = UTC 22:00 (전날)
    # cron은 하나만 둔다. 예전에 "0 22"와 "20 22" 두 개가 걸려 있어서
    # 매일 아침 같은 브리핑이 20분 간격으로 두 번 발송됐다.
    - cron: "0 22 * * *"
  # Actions 탭에서 수동 실행(테스트)도 가능하게
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send briefing
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          # briefing.py는 예전부터 가족 발송(RECIPIENTS의 두 번째 항목)을
          # 지원했지만, 이 값이 job에 전달되지 않아 실제로는 한 번도 발송된 적이
          # 없다. 토큰이 없으면 조용히 건너뛰는 설계라 로그로도 드러나지 않았다.
          # Secrets에 KAKAO_REFRESH_TOKEN_2를 등록하면 그때부터 함께 나간다.
          KAKAO_REFRESH_TOKEN_2: ${{ secrets.KAKAO_REFRESH_TOKEN_2 }}
        run: python briefing.py
