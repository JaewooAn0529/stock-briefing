name: daily-log

on:
  schedule:
    # KST 16:30 = UTC 07:30 (KRX closes 15:30 KST; allow settle time)
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [daily-log]

permissions:
  contents: write

concurrency:
  group: daily-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pykrx pandas

      - name: Run daily log
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python daily_log.py

      - name: Show what was produced
        run: |
          echo "--- data directory ---"
          ls -la data/ || echo "data/ does not exist"

      - name: Commit updated log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "log: daily foreign net-buy snapshot"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
