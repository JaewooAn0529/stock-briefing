
name: daily-log
 
on:
  schedule:
    # KST 16:30 = UTC 07:30 (KRX closes 15:30 KST; allow settle time)
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [daily-log]
 
permissions:
  contents: write
 
concurrency:
  group: daily-log
  cancel-in-progress: false
 
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Run daily log
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        # daily_log.py exits non-zero when it produces nothing usable,
        # so a KRX login / data failure now fails this step instead of
        # going green. The step (and job) stops here on a bad exit code.
        run: python daily_log.py
 
      - name: Show what was produced
        run: |
          echo "--- data directory ---"
          ls -la data/ || echo "data/ does not exist"
 
      - name: Verify output exists
        # Belt-and-suspenders: fail loudly if the CSV somehow isn't there,
        # even if the script above returned 0.
        run: |
          if [ ! -f data/predictions.csv ]; then
            echo "::error::data/predictions.csv is missing — nothing to commit"
            exit 1
          fi
          echo "predictions.csv present ($(wc -l < data/predictions.csv) lines)"
 
      - name: Commit updated log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily log $(date -u +'%Y-%m-%d')"
            git push
          fi
 
